name: BTV Android Debug Build and Emulator Smoke Test

on:
  push:
    branches:
      - btv/controls-hardening-prototype-layout-plan-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btv-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.7.2 and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify toolchain and import project
        run: |
          godot --version
          java -version
          godot --headless --editor --path . --quit

      - name: Create temporary Android debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/btv-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export arm64 and x86_64 debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/btv-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/BTV-debug.apk
          test -s build/android/BTV-debug.apk
          ls -lh build/android/BTV-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BTV-Android-Debug-APK
          path: build/android/BTV-debug.apk
          if-no-files-found: error
          retention-days: 7

  emulator-smoke:
    name: Install and launch APK in Android emulator
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: BTV-Android-Debug-APK
          path: build/android

      - name: Boot Android emulator and smoke-test app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install build/android/BTV-debug.apk
            adb shell monkey -p org.kingace.beyondtheveil 1
            sleep 15
            adb shell pidof org.kingace.beyondtheveil
            adb logcat -d -t 4000 > "$RUNNER_TEMP/btv-emulator-logcat.txt"
            if grep -E "FATAL EXCEPTION|Fatal signal" "$RUNNER_TEMP/btv-emulator-logcat.txt"; then
              echo "Android runtime reported a fatal crash."
              exit 1
            fi
