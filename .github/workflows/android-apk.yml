name: BTV Android Debug APK

on:
  push:
    branches:
      - btv/android-apk-prototype-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btv-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Headless validation and Android APK export
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"
          yes | sdkmanager --licenses

      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify toolchain
        run: |
          godot --version
          java -version
          adb version

      - name: Create temporary debug signing key
        run: |
          mkdir -p build
          keytool -genkeypair -v -keystore build/btv-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BTV Debug,O=Prototype,C=GH"

      - name: Import project and run headless smoke tests
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --script res://tests/nli_smoke_test.gd
          godot --headless --path . --script res://tests/character_scene_smoke_test.gd
          godot --headless --path . --quit-after 10

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BTV-debug.apk
          test -s build/BTV-debug.apk
          sha256sum build/BTV-debug.apk | tee build/SHA256SUMS.txt

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: BTV-Android-Debug-APK
          path: |
            build/BTV-debug.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
