name: BTV Godot Validation

on:
  push:
    branches:
      - btv/bootstrap-prototype-001
      - btv/test-first-contracts-001
      - btv/camera-relative-mouselook-001
      - btv/mobile-touch-input-adapter-001
      - btv/xh-003-input-source-composition-spec-001
      - btv/controls-hardening-prototype-layout-plan-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btv-godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Import, contract tests and scene launch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify engine version
        run: godot --version

      - name: Import project and validate editor parsing
        run: godot --headless --editor --path . --quit

      - name: Run NLI smoke tests
        run: godot --headless --path . --script res://tests/nli_smoke_test.gd

      - name: Run NLI handoff and source-registry contract tests
        run: godot --headless --path . --script res://tests/nli_contract_test.gd

      - name: Run mission data validator contract tests
        run: godot --headless --path . --script res://tests/mission_data_validator_test.gd

      - name: Run core interaction acceptance tests
        run: godot --headless --path . --script res://tests/core_interaction_acceptance_test.gd

      - name: Run player camera input tests
        run: godot --headless --path . --script res://tests/player_camera_input_test.gd

      - name: Run touch input adapter tests
        run: godot --headless --path . --script res://tests/touch_input_adapter_test.gd

      - name: Run touch controls integration tests
        run: godot --headless --path . --script res://tests/touch_controls_integration_test.gd

      - name: Run touch controls coexistence tests
        run: godot --headless --path . --script res://tests/touch_controls_coexistence_test.gd

      - name: Run touch controls composition tests
        run: godot --headless --path . --script res://tests/touch_controls_composition_test.gd

      - name: Run touch controls input-path tests
        run: godot --headless --path . --script res://tests/touch_controls_input_path_test.gd

      - name: Run touch controls lifecycle tests
        run: godot --headless --path . --script res://tests/touch_controls_lifecycle_test.gd

      - name: Run touch controls reconciliation tests
        run: godot --headless --path . --script res://tests/touch_controls_reconciliation_test.gd

      - name: Run touch controls resize tests
        run: godot --headless --path . --script res://tests/touch_controls_resize_test.gd

      - name: Run touch input source composition tests
        run: godot --headless --path . --script res://tests/touch_input_source_composition_test.gd

      - name: Launch main scene for 10 frames
        run: godot --headless --path . --quit-after 10
