name: BTV Roblox Validation

on:
  push:
    branches:
      - btv/roblox-foundation-001
    paths:
      - "roblox/**"
      - ".github/workflows/roblox-validation.yml"
  pull_request:
    branches:
      - btv/roblox-foundation-001
    paths:
      - "roblox/**"
      - ".github/workflows/roblox-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btv-roblox-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Luau tests, lint, format and Rojo build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: roblox
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Roblox toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install project tools
        run: rokit install --no-trust-check

      - name: Verify toolchain
        run: |
          rojo --version
          selene --version
          stylua --version
          lune --version

      - name: Run headless foundation regression tests
        run: lune run tests/foundation.spec.luau

      - name: Format foundation Luau on branch pushes
        if: github.event_name == 'push'
        run: stylua src/server/Services/MissionService.luau src/server/Services/CompanionActorService.luau src/server/Bootstrap.server.luau tests/foundation.spec.luau

      - name: Verify Luau formatting
        run: stylua --check src/server/Services/MissionService.luau src/server/Services/CompanionActorService.luau src/server/Bootstrap.server.luau tests/foundation.spec.luau

      - name: Commit formatting corrections
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- src/server/Services/MissionService.luau src/server/Services/CompanionActorService.luau src/server/Bootstrap.server.luau tests/foundation.spec.luau; then
            echo "No formatting corrections needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/Services/MissionService.luau src/server/Services/CompanionActorService.luau src/server/Bootstrap.server.luau tests/foundation.spec.luau
          git commit -m "style: format BTV Roblox foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Lint Luau source
        run: selene src tests

      - name: Build Roblox place
        run: |
          mkdir -p build
          rojo build default.project.json --output build/BTVRoblox.rbxlx

      - name: Upload built place artifact
        uses: actions/upload-artifact@v4
        with:
          name: btv-roblox-place
          path: roblox/build/BTVRoblox.rbxlx
          if-no-files-found: error
          retention-days: 7
