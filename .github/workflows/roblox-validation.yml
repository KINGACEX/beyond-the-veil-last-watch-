name: BTV Roblox Validation

on:
  push:
    branches:
      - btv/roblox-foundation-001
      - btv/roblox-covenant-multiplayer-fixes-001
    paths:
      - "roblox/**"
      - ".github/workflows/roblox-validation.yml"
  pull_request:
    branches:
      - btv/roblox-covenant-multiplayer-fixes-001
    paths:
      - "roblox/**"
      - ".github/workflows/roblox-validation.yml"
  workflow_dispatch:

# Validation must be read-only. Formatting changes belong in reviewed commits,
# never in an automated workflow push.
permissions:
  contents: read

concurrency:
  group: btv-roblox-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Luau tests, lint, format and Rojo build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: roblox
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Roblox toolchain
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install project tools
        run: rokit install --no-trust-check

      - name: Verify toolchain
        run: |
          rojo --version
          selene --version
          stylua --version
          lune --version

      - name: Run headless foundation regression tests
        run: lune run tests/foundation.spec.luau

      - name: Verify Luau formatting
        run: stylua --check tests/foundation.spec.luau

      - name: Lint Luau source
        run: selene src tests

      - name: Build Roblox place
        run: |
          mkdir -p build
          rojo build default.project.json --output build/BTVRoblox.rbxlx

      - name: Upload built place artifact
        uses: actions/upload-artifact@v4
        with:
          name: btv-roblox-place
          path: roblox/build/BTVRoblox.rbxlx
          if-no-files-found: error
          retention-days: 7
