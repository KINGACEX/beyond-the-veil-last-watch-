<text x="60" y="65" fill="#f4efe6" font-family="Arial,sans-serif" font-size="28" letter-spacing="6">BEYOND THE VEIL: THE LAST WATCH</text>
<text x="60" y="110" fill="#d5b57d" font-family="Arial,sans-serif" font-size="18" letter-spacing="4">LOGOS RHEMA TEMPLE · OPENING SUNDAY · STORYBOARD v02</text>
<text x="1740" y="75" text-anchor="end" fill="#e4c78e" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">PROPOSED · SLICE-GROUNDED · NOT FINAL</text>
<g transform="translate(50 155)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">01 · ARRIVAL & FELLOWSHIP</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><rect x="155" y="95" width="95" height="150" rx="5" fill="#72513a"/><path d="M202 95V245" stroke="#d4b27d" stroke-width="4"/><circle cx="230" cy="175" r="5" fill="#e5d4b8"/><text x="18" y="292" fill="#cfc7ba" font-size="12">People arrive, greet one another, and settle in.</text></g><g transform="translate(475 155)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">02 · WELCOME</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><circle cx="202" cy="130" r="24" fill="#303941"/><path d="M165 160H239L260 270H144Z" fill="#303941"/><path d="M240 180L285 145" stroke="#c59b69" stroke-width="12" stroke-linecap="round"/><circle cx="315" cy="170" r="20" fill="#56605c"/><text x="18" y="292" fill="#cfc7ba" font-size="12">A warm welcome; the room remains a community, not a mission hub.</text></g><g transform="translate(900 155)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">03 · PRAISE & WORSHIP</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><g fill="#303941"><circle cx="125" cy="175" r="18"/><path d="M103 197H147L158 285H92Z"/><circle cx="280" cy="175" r="18"/><path d="M258 197H302L313 285H247Z"/></g><path d="M125 155L105 105M125 155L145 105M280 155L260 105M280 155L300 105" stroke="#cba873" stroke-width="7" stroke-linecap="round"/><text x="18" y="292" fill="#cfc7ba" font-size="12">Respectful communal worship; no invented lyrics or spectacle.</text></g><g transform="translate(1325 155)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">04 · PRAYER</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><g fill="#303941"><circle cx="170" cy="155" r="20"/><path d="M145 178H195L205 280H135Z"/><circle cx="260" cy="155" r="20"/><path d="M235 178H285L295 280H225Z"/></g><path d="M150 195Q170 225 190 195M240 195Q260 225 280 195" fill="none" stroke="#d4bd99" stroke-width="6"/><text x="18" y="292" fill="#cfc7ba" font-size="12">A quiet, reflective moment with no mechanical reward.</text></g><g transform="translate(50 510)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">05 · SCRIPTURE READING</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><path d="M105 150Q160 125 210 155V270Q160 240 105 260Z" fill="#eee4d1" stroke="#8a7458" stroke-width="5"/><path d="M210 155Q260 125 315 150V260Q260 240 210 270Z" fill="#f5ead8" stroke="#8a7458" stroke-width="5"/><path d="M210 155V270" stroke="#8a7458" stroke-width="3"/><text x="18" y="292" fill="#cfc7ba" font-size="12">A reader opens Scripture; no unapproved verse is rendered as on-screen text.</text></g><g transform="translate(475 510)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">06 · KITFIT</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><circle cx="210" cy="120" r="23" fill="#303941"/><path d="M175 148H245L265 260H155Z" fill="#303941"/><rect x="260" y="210" width="80" height="60" rx="5" fill="#eee4d1" stroke="#8a7458" stroke-width="4"/><path d="M300 210V270" stroke="#8a7458" stroke-width="2"/><text x="18" y="292" fill="#cfc7ba" font-size="12">A short Scripture-based teaching about giving; acronym expansion remains unknown.</text></g><g transform="translate(900 510)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">07 · OFFERING</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><rect x="150" y="205" width="130" height="75" rx="8" fill="#6b4931" stroke="#3d291e" stroke-width="5"/><path d="M185 210H245" stroke="#211a15" stroke-width="7"/><path d="M105 165L150 205M325 165L280 205" stroke="#c6a177" stroke-width="14" stroke-linecap="round"/><text x="18" y="292" fill="#cfc7ba" font-size="12">Voluntary giving, without visible amounts, pressure, or comparison.</text></g><g transform="translate(1325 510)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">08 · SERMON</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><circle cx="210" cy="120" r="23" fill="#303941"/><path d="M175 148H245L260 275H160Z" fill="#303941"/><path d="M145 205H275L260 225H160Z" fill="#8b6644"/><path d="M210 190V205" stroke="#d9c7a8" stroke-width="4"/><text x="18" y="292" fill="#cfc7ba" font-size="12">Teaching continues in the context of the congregation's life.</text></g><g transform="translate(50 865)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">09 · RESPONSE & REFLECTION</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><g fill="#303941"><circle cx="125" cy="175" r="18"/><path d="M103 197H147L158 285H92Z"/><circle cx="280" cy="175" r="18"/><path d="M258 197H302L313 285H247Z"/></g><path d="M70 120Q210 55 350 120" fill="none" stroke="#c7a779" stroke-width="3" stroke-dasharray="7 8"/><text x="18" y="292" fill="#cfc7ba" font-size="12">The congregation reflects; no forced response prompt or morality score.</text></g><g transform="translate(475 865)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">10 · COMMUNION</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><rect x="105" y="230" width="210" height="24" fill="#765039"/><path d="M105 254H315V280H105Z" fill="#513421"/><ellipse cx="185" cy="218" rx="42" ry="16" fill="#eee2c9" stroke="#a58c68" stroke-width="3"/><path d="M185 202Q165 180 176 165Q205 166 208 194Z" fill="#f4ead8"/><path d="M245 195H275L284 232H236Z" fill="#e9d9ba" stroke="#8b7658" stroke-width="3"/><ellipse cx="260" cy="195" rx="15" ry="6" fill="#7e2e2c"/><text x="18" y="292" fill="#cfc7ba" font-size="12">Bread and cup are presented in a quiet, contextual moment; no buffs or rewards.</text></g><g transform="translate(900 865)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">11 · ANNOUNCEMENTS & CLOSING PRAYER</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><circle cx="210" cy="120" r="22" fill="#303941"/><path d="M175 148H245L260 265H160Z" fill="#303941"/><path d="M130 280H290" stroke="#8b6644" stroke-width="12"/><path d="M95 180Q120 150 145 180M275 180Q300 150 325 180" fill="none" stroke="#c7a779" stroke-width="5"/><text x="18" y="292" fill="#cfc7ba" font-size="12">Practical notices and the service's closing prayer conclude the gathering.</text></g><g transform="translate(1325 865)"><rect width="400" height="320" rx="12" fill="#20262c" stroke="#8e795a" stroke-width="2"/><text x="18" y="32" fill="#e4c78e" font-size="14" letter-spacing="1">12 · FELLOWSHIP / ALERT AFTER SERVICE</text><rect x="18" y="48" width="364" height="220" fill="#d7d0c4"/><path d="M18 48H382V95H18Z" fill="#73523b"/><path d="M18 268L125 190H275L382 268Z" fill="#86705a"/><rect x="155" y="175" width="110" height="155" rx="15" fill="#252c31" stroke="#d4b57d" stroke-width="5"/><rect x="170" y="195" width="80" height="110" rx="5" fill="#71818a"/><path d="M285 185Q325 165 315 135M295 205Q355 175 340 115" fill="none" stroke="#d4b57d" stroke-width="4" stroke-linecap="round"/><circle cx="210" cy="318" r="5" fill="#d4b57d"/><text x="18" y="292" fill="#cfc7ba" font-size="12">Community continues; only after service ends does Asher notice the quiet Covenant alert.</text></g>
<rect x="50" y="1240" width="1700" height="95" rx="12" fill="#20262c" stroke="#8e795a"/>
<text x="78" y="1280" fill="#f2eee6" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">CONTINUITY LOCKS</text>
<text x="78" y="1310" fill="#cfc7ba" font-family="Arial,sans-serif" font-size="14">Ember waits under HOLD at the designated spot. Covenant alert is queued until service ends. No service phase grants rewards or buffs. Congregation does not know Asher is Covenant.</text>
