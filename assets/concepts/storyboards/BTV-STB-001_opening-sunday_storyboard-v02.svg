<title id="t">BTV opening Sunday — full service storyboard exploration 02</title>
<desc id="d">Twelve-panel storyboard covering the approved Logos Rhema Temple Sunday service phases and the quiet Covenant alert only after service ends. Generic silhouettes only; no final character likenesses.</desc>
