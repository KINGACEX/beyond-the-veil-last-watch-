<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">BTV Logos Rhema Temple interior — concept exploration 01</title>
<desc id="desc">Three-panel architectural visual exploration of a contemporary community church interior: central aisle, pews, simple cross and lectern, daylight windows and warm timber. Not an approved canon asset.</desc>
<defs>
  <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#e9e3d8"/><stop offset="1" stop-color="#b8b1a6"/></linearGradient>
  <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#8a5c39"/><stop offset="1" stop-color="#3d291e"/></linearGradient>
  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#a68c72"/><stop offset="1" stop-color="#3d342e"/></linearGradient>
  <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#c8e1e8"/><stop offset="1" stop-color="#728d90"/></linearGradient>
  <linearGradient id="light" x2="0" y2="1"><stop stop-color="#fff6d7" stop-opacity=".7"/><stop offset="1" stop-color="#f5c77c" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
  <pattern id="grain" width="90" height="12" patternUnits="userSpaceOnUse"><path d="M0 4H90 M12 9H70" stroke="#d4b18b" stroke-opacity=".18" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="1000" fill="#171a1e"/>
<text x="70" y="62" fill="#f2eee6" font-family="Arial,sans-serif" font-size="27" letter-spacing="5">BEYOND THE VEIL: THE LAST WATCH</text>
<text x="70" y="104" fill="#d4bd91" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">LOGOS RHEMA TEMPLE · INTERIOR STUDY 01</text>
<text x="1530" y="72" text-anchor="end" fill="#e7c98d" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">PROPOSED / NOT CANON-LOCKED</text>

<!-- PANEL ONE: central nave -->
<g transform="translate(55 145)">
<rect width="920" height="650" rx="14" fill="#282b2e" stroke="#88795e" stroke-width="2"/>
<text x="28" y="42" fill="#e9d7b2" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">A · CENTRAL AISLE / ESTABLISHING VIEW</text>
<g transform="translate(25 65)">
<rect width="870" height="555" fill="url(#wall)"/>
<path d="M0 0L435 120L870 0V555H0Z" fill="#d9d3c8"/>
