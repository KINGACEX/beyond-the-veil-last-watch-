</g>
<!-- beams and pendants -->
<g stroke="#513c2b" stroke-width="14"><path d="M0 32L435 122L870 32"/><path d="M75 0L435 92L795 0"/></g>
<g fill="#fff0c9"><path d="M210 65V118" stroke="#4b3c2d" stroke-width="4"/><ellipse cx="210" cy="120" rx="15" ry="8"/><path d="M660 65V118" stroke="#4b3c2d" stroke-width="4"/><ellipse cx="660" cy="120" rx="15" ry="8"/></g>
</g>
</g>

<!-- PANEL TWO: side view -->
<g transform="translate(1000 145)">
<rect width="545" height="310" rx="14" fill="#282b2e" stroke="#88795e" stroke-width="2"/>
<text x="24" y="40" fill="#e9d7b2" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">B · SIDE SEATING / DAYLIGHT</text>
<rect x="22" y="62" width="501" height="225" fill="#d9d1c4"/>
<path d="M22 62L523 62V125H22Z" fill="#72513a"/>
<g fill="url(#glass)" stroke="#f2e8d6" stroke-width="5">
<rect x="45" y="100" width="75" height="110"/><rect x="155" y="100" width="75" height="110"/>
</g>
<path d="M22 287L230 220H523V287Z" fill="url(#floor)"/>
<g fill="url(#wood)" stroke="#402c20" stroke-width="3">
<path d="M255 210H510V226H255Z"/><path d="M285 230H510V247H285Z"/><path d="M320 251H510V268H320Z"/>
</g>
<path d="M122 62L255 287M230 62L355 287" stroke="#fff3d5" stroke-opacity=".25" stroke-width="34"/>
</g>

<!-- PANEL THREE: platform detail -->
<g transform="translate(1000 485)">
<rect width="545" height="310" rx="14" fill="#282b2e" stroke="#88795e" stroke-width="2"/>
<text x="24" y="40" fill="#e9d7b2" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">C · PLATFORM / SIMPLE FOCAL POINT</text>
<rect x="22" y="62" width="501" height="225" fill="url(#wall)"/>
<path d="M150 62V287M395 62V287" stroke="#72513a" stroke-width="16"/>
<path d="M272 95V180M238 128H306" stroke="#674c34" stroke-width="10"/>
<rect x="220" y="206" width="105" height="62" fill="url(#wood)"/>
<path d="M205 205H340L327 190H218Z" fill="#a97b50"/>
<path d="M22 287L160 258H385L523 287Z" fill="#7a6957"/>
<g fill="#47715c"><ellipse cx="105" cy="245" rx="17" ry="38"/><ellipse cx="420" cy="245" rx="17" ry="38"/></g>
<g fill="#6d966f"><path d="M105 208Q65 195 82 165Q112 177 105 208Q120 171 143 176Q142 204 105 208Z"/><path d="M420 208Q380 195 397 165Q427 177 420 208Q435 171 458 176Q457 204 420 208Z"/></g>
</g>

<rect x="55" y="825" width="1490" height="105" rx="12" fill="#202428" stroke="#88795e"/>
<text x="82" y="865" fill="#f2eee6" font-family="Arial,sans-serif" font-size="20" letter-spacing="2">DESIGN INTENT</text>
<text x="82" y="898" fill="#c9c2b7" font-family="Arial,sans-serif" font-size="16">A welcoming, practical community worship space. Keep the layout legible, lived-in and contemporary; avoid luxury-cathedral scale or military-base styling.</text>
<text x="1515" y="965" text-anchor="end" fill="#d4bd91" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">BTV-ENV-001 · CONCEPT STUDY 01 · NOT APPROVED FOR CANON</text>
</svg>