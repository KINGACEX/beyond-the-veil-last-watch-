<path d="M35 0L435 100L835 0" fill="none" stroke="#745139" stroke-width="12"/>
<path d="M435 0V555" stroke="#9a8e7c" stroke-opacity=".25"/>
<!-- side windows -->
<g fill="url(#glass)" stroke="#f0e8d8" stroke-width="8">
<path d="M35 105L170 135V310L35 292Z"/><path d="M700 135L835 105V292L700 310Z"/>
<path d="M35 330L170 344V440L35 430Z"/><path d="M700 344L835 330V430L700 440Z"/>
</g>
<g stroke="#d9e3df" stroke-width="4" opacity=".8">
<path d="M102 120V300M35 205H170M767 120V300M700 205H835"/>
</g>
<path d="M35 110L170 310L170 450L35 430Z" fill="url(#light)"/>
<path d="M835 110L700 310L700 450L835 430Z" fill="url(#light)"/>
<!-- platform and wall -->
<path d="M310 285H560V375H310Z" fill="#b9b0a2"/>
<path d="M295 375H575V392H295Z" fill="#75614f"/>
<path d="M330 180H540V290H330Z" fill="#c8c0b4"/>
<path d="M435 198V272M403 223H467" stroke="#674c34" stroke-width="10" stroke-linecap="square"/>
<rect x="413" y="318" width="44" height="57" fill="url(#wood)"/>
<path d="M395 318H475L465 305H405Z" fill="#a97b50"/>
<!-- floor -->
<path d="M0 555L310 392H560L870 555Z" fill="url(#floor)"/>
<path d="M0 555L310 392H560L870 555Z" fill="url(#grain)"/>
<path d="M435 395L435 555" stroke="#d8c2a0" stroke-opacity=".3" stroke-width="3"/>
<!-- pews -->
<g fill="url(#wood)" stroke="#3d291e" stroke-width="3">
<path d="M28 470L330 430V449L28 496Z"/><path d="M0 520L300 468V491L0 555Z"/>
<path d="M842 470L540 430V449L842 496Z"/><path d="M870 520L570 468V491L870 555Z"/>
<path d="M75 414L325 390V405L75 440Z"/><path d="M795 414L545 390V405L795 440Z"/>
<path d="M135 365L340 350V362L135 386Z"/><path d="M735 365L530 350V362L735 386Z"/>
